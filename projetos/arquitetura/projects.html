<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salsi — Projetos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fbfaf8">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M4 11l8-7 8 7"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"/>
</symbol>
<symbol id="i-building" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <rect x="6" y="3" width="12" height="18" rx="1"/>
  <rect x="9" y="6.5" width="2" height="2" fill="currentColor" stroke="none"/><rect x="13" y="6.5" width="2" height="2" fill="currentColor" stroke="none"/>
  <rect x="9" y="11" width="2" height="2" fill="currentColor" stroke="none"/><rect x="13" y="11" width="2" height="2" fill="currentColor" stroke="none"/>
  <rect x="9" y="15.5" width="2" height="2" fill="currentColor" stroke="none"/><rect x="13" y="15.5" width="2" height="2" fill="currentColor" stroke="none"/>
</symbol>
<symbol id="i-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/>
</symbol>
<symbol id="i-notes" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <rect x="4" y="3" width="16" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/>
</symbol>
<symbol id="i-cube" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 2L20 6.5V17.5L12 22L4 17.5V6.5L12 2Z"/><path d="M12 12V22"/><path d="M12 12L20 6.5"/><path d="M12 12L4 6.5"/>
</symbol>
<symbol id="i-report" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M7 3h7l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v4h4"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="16" x2="15" y2="16"/>
</symbol>
<symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M3.5 12h3M17.5 12h3"/>
</symbol>
<symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M5 7h14"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M7 7l1 13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1l1-13"/>
</symbol>
<symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
  <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
</symbol>
</defs>
</svg>

<div id="offline-banner-root"></div>
<div class="shell">
  <div id="sidebar-root"></div>
  <main class="main">
    <div class="topbar">
      <div class="brand-mark"><img src="logo.png" alt="Salsi"><span class="display">Salsi</span></div>
      <a class="project-pill" href="projects.html" id="activeProjectPill">
        <svg><use href="#i-building"/></svg><span>Carregando…</span>
      </a>
    </div>
    <div class="content">
      
      <!-- Editorial Page Header -->
      <div class="page-header-block">
        <h1 class="page-title">Coleção de Projetos</h1>
        <p class="page-sub">Espaço dedicado ao gerenciamento de modelos e documentações</p>
      </div>

      <div class="card" style="margin-bottom: 60px;">
        <h3 style="font-size: 16px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 24px;">Novo projeto</h3>
        <div style="display:grid; gap:24px; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); margin-bottom:24px;">
          <div>
            <label class="field-label">Nome do Projeto *</label>
            <input type="text" id="newProjName" placeholder="Ex.: Residência Jardins">
          </div>
          <div>
            <label class="field-label">Cliente</label>
            <input type="text" id="newProjClient" placeholder="Ex.: Cláudia Souza">
          </div>
          <div>
            <label class="field-label">Endereço</label>
            <input type="text" id="newProjAddress" placeholder="Ex.: Av. das Palmeiras, 100">
          </div>
        </div>
        <div style="margin-bottom:24px;">
          <label class="field-label">Descrição</label>
          <textarea id="newProjDesc" placeholder="Ex.: Reforma completa e ampliação da área gourmet" rows="2" style="width:100%; border:none; border-bottom:1.5px solid var(--border); background:transparent; color:var(--text-primary); font-family:var(--font-sans); font-size:14px; resize:vertical; padding:8px 0;"></textarea>
        </div>
        <button class="btn primary" id="createProjBtn" style="min-height:42px;">Criar projeto</button>
      </div>

      <div class="grid" id="projectsList"></div>

    </div>
<div id="sync-card-root"></div>
<script src="assets/db.js"></script>
<script src="assets/shell.js"></script>
<script>
SalsiShell.init('projects');
(async function () {
  'use strict';

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  async function renderList() {
    const projects = await SalsiDB.getProjects();
    const activeId = SalsiShell.getActiveProjectId();
    const active = activeId ? await SalsiDB.getProject(activeId) : null;
    const pillEl = document.getElementById('activeProjectPill');
    if (pillEl) pillEl.querySelector('span').textContent = active ? active.name : 'Nenhum Projeto';

    const el = document.getElementById('projectsList');
    if (projects.length === 0) {
      el.innerHTML = `<div class="empty" style="grid-column:1/-1"><img src="logo.png" alt=""><strong>Nenhum projeto ainda</strong><span>Crie o primeiro ali em cima.</span></div>`;
      return;
    }
    el.innerHTML = projects.map(p => `
      <div class="card" style="display:flex; flex-direction:column; justify-content:space-between; min-height:220px;">
        <div>
          <div style="display:flex;justify-content:space-between;align-items:start;gap:8px;margin-bottom:8px;">
            <h3 style="margin:0;font-size:16px;">${esc(p.name)}</h3>
            ${p.id === activeId ? '<span class="badge-pill synced">Ativo</span>' : ''}
          </div>
          ${p.client ? `<p style="color:var(--accent);font-size:12px;margin:0 0 4px;font-weight:700;">Cliente: ${esc(p.client)}</p>` : ''}
          ${p.address ? `<p style="color:var(--text-secondary);font-size:12px;margin:0 0 8px;">Endereço: ${esc(p.address)}</p>` : ''}
          <p style="color:var(--text-secondary);font-size:13px;margin:8px 0 14px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;">
            ${esc(p.description || 'Sem descrição')}
          </p>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;">
          <button class="btn primary" data-activate="${p.id}"><svg><use href="#i-cube"/></svg>Abrir modelo</button>
          <button class="btn danger" data-delete="${p.id}"><svg><use href="#i-trash"/></svg></button>
        </div>
      </div>`).join('');

    el.querySelectorAll('[data-activate]').forEach(btn => btn.addEventListener('click', () => {
      SalsiShell.setActiveProjectId(btn.dataset.activate);
      location.href = 'models.html';
    }));
    el.querySelectorAll('[data-delete]').forEach(btn => btn.addEventListener('click', async () => {
      if (!confirm('Excluir este projeto e todos os dados ligados a ele (fotos, notas, modelo, marcações)? Essa ação não pode ser desfeita.')) return;
      await SalsiDB.deleteProject(btn.dataset.delete);
      if (SalsiShell.getActiveProjectId() === btn.dataset.delete) localStorage.removeItem('salsi:activeProjectId');
      await renderList();
      await SalsiShell.refreshAll();
    }));
  }

  document.getElementById('createProjBtn').addEventListener('click', async () => {
    const nameEl = document.getElementById('newProjName');
    const clientEl = document.getElementById('newProjClient');
    const addressEl = document.getElementById('newProjAddress');
    const descEl = document.getElementById('newProjDesc');

    if (!nameEl.value.trim()) { nameEl.focus(); return; }

    const project = await SalsiDB.addProject({
      name: nameEl.value.trim(),
      client: clientEl.value.trim(),
      address: addressEl.value.trim(),
      description: descEl.value.trim()
    });

    nameEl.value = '';
    clientEl.value = '';
    addressEl.value = '';
    descEl.value = '';

    SalsiShell.setActiveProjectId(project.id);
    await renderList();
  });

  await renderList();
})();

</script>
</body>
</html>
