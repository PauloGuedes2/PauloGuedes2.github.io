<div id="offline-banner-root"></div>
<div class="shell">
  <div id="sidebar-root"></div>
  <main class="main">
    <div class="topbar">
      <div class="brand-mark"><img src="logo.png" alt="Salsi"><span class="display">Salsi</span></div>
      <a class="project-pill" href="projects.html"><svg><use href="#i-building"/></svg><span>Trocar projeto</span></a>
    </div>
    <div class="content">
      <h1 class="page-title">Notas estruturais</h1>
      <p class="page-sub">Observações de campo, ligadas ao projeto ativo.</p>

      <div id="noProjectState" class="empty" style="display:none">
        <img src="logo.png" alt=""><strong>Nenhum projeto selecionado</strong>
        <span>Escolha um projeto antes de adicionar notas.</span>
        <div style="margin-top:14px"><a class="btn primary" href="projects.html"><svg><use href="#i-building"/></svg>Ir pra Projects</a></div>
      </div>

      <div id="notesArea" style="display:none">
        <div class="card">
          <h3>Nova nota</h3>
          <div style="display:grid;gap:10px;grid-template-columns:1fr 160px">
            <div><label class="field-label">Título</label><input type="text" id="noteTitle" placeholder="Ex.: Viga A4"></div>
            <div><label class="field-label">Tag</label><input type="text" id="noteTag" placeholder="Ex.: Estrutural"></div>
          </div>
          <label class="field-label" style="margin-top:10px;display:block">Descrição</label>
          <textarea id="noteBody" placeholder="O que precisa de atenção?"></textarea>
          <button class="btn primary" id="addNoteBtn" style="margin-top:10px"><svg><use href="#i-plus"/></svg>Adicionar nota</button>
        </div>
        <div id="notesList"></div>
      </div>

    </div>
  </main>
</div>
<div id="sync-card-root"></div>
<script src="assets/db.js"></script>
<script src="assets/shell.js"></script>
<script>
SalsiShell.init('notes');
(async function () {
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function fmtDate(ts) { return new Date(ts).toLocaleString('pt-BR'); }

  const activeId = SalsiShell.getActiveProjectId();
  if (!activeId) {
    document.getElementById('noProjectState').style.display = '';
    return;
  }
  document.getElementById('notesArea').style.display = '';

  async function renderList() {
    const notes = await SalsiDB.getNotes(activeId);
    const el = document.getElementById('notesList');
    if (notes.length === 0) {
      el.innerHTML = `<div class="empty"><img src="logo.png" alt=""><strong>Nenhuma nota ainda</strong><span>Adicione a primeira nota deste projeto ali em cima.</span></div>`;
      return;
    }
    el.innerHTML = notes.map(n => `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:start;gap:8px">
          <div>
            <strong style="font-family:'Manrope',sans-serif;color:var(--navy)">${esc(n.title)}</strong>
            ${n.tag ? `<span class="badge-pill pending" style="margin-left:8px">${esc(n.tag)}</span>` : ''}
          </div>
          <span class="badge-pill ${n.synced ? 'synced' : 'pending'}">${n.synced ? 'Sincronizada' : 'Pendente'}</span>
        </div>
        <p style="font-size:13.5px;margin:8px 0">${esc(n.body || '—')}</p>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="color:var(--ink-dim);font-size:11.5px">${fmtDate(n.createdAt)}</span>
          <button class="btn danger" data-del="${n.id}"><svg><use href="#i-trash"/></svg></button>
        </div>
      </div>`).join('');
    el.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', async () => {
      await SalsiDB.deleteNote(btn.dataset.del);
      await renderList();
      await SalsiShell.refreshAll();
    }));
  }

  document.getElementById('addNoteBtn').addEventListener('click', async () => {
    const titleEl = document.getElementById('noteTitle');
    if (!titleEl.value.trim()) { titleEl.focus(); return; }
    await SalsiDB.addNote({
      projectId: activeId,
      title: titleEl.value.trim(),
      tag: document.getElementById('noteTag').value.trim(),
      body: document.getElementById('noteBody').value.trim(),
    });
    titleEl.value = ''; document.getElementById('noteTag').value = ''; document.getElementById('noteBody').value = '';
    await renderList();
    await SalsiShell.refreshAll();
  });

  await renderList();
})();

</script>
</body>
</html>
