<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salsi — Notas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fbfaf8">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M4 11l8-7 8 7"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"/>
</symbol>
<symbol id="i-building" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <rect x="6" y="3" width="12" height="18" rx="1"/>
  <rect x="9" y="6.5" width="2" height="2" fill="currentColor" stroke="none"/><rect x="13" y="6.5" width="2" height="2" fill="currentColor" stroke="none"/>
  <rect x="9" y="11" width="2" height="2" fill="currentColor" stroke="none"/><rect x="13" y="11" width="2" height="2" fill="currentColor" stroke="none"/>
  <rect x="9" y="15.5" width="2" height="2" fill="currentColor" stroke="none"/><rect x="13" y="15.5" width="2" height="2" fill="currentColor" stroke="none"/>
</symbol>
<symbol id="i-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/>
</symbol>
<symbol id="i-notes" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <rect x="4" y="3" width="16" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/>
</symbol>
<symbol id="i-cube" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 2L20 6.5V17.5L12 22L4 17.5V6.5L12 2Z"/><path d="M12 12V22"/><path d="M12 12L20 6.5"/><path d="M12 12L4 6.5"/>
</symbol>
<symbol id="i-report" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M7 3h7l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v4h4"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="16" x2="15" y2="16"/>
</symbol>
<symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M3.5 12h3M17.5 12h3"/>
</symbol>
<symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M5 7h14"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M7 7l1 13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1l1-13"/>
</symbol>
<symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
  <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
</symbol>
</defs>
</svg>

<div id="offline-banner-root"></div>
<div class="shell">
  <div id="sidebar-root"></div>
  <main class="main">
    <div class="topbar">
      <div class="brand-mark"><img src="logo.png" alt="Salsi"><span class="display">Salsi</span></div>
      <a class="project-pill" href="projects.html" id="activeProjectPill">
        <svg><use href="#i-building"/></svg><span>Carregando…</span>
      </a>
    </div>
    <div class="content">
      
      <!-- Editorial Page Header -->
      <div class="page-header-block">
        <h1 class="page-title">Notas de Campo</h1>
        <p class="page-sub">Observações e marcações vinculadas ao projeto ativo</p>
      </div>

      <div id="noProjectState" class="empty" style="display:none">
        <img src="logo.png" alt=""><strong>Nenhum projeto selecionado</strong>
        <span>Escolha um projeto antes de adicionar notas.</span>
        <div style="margin-top:14px"><a class="btn primary" href="projects.html">Ir para Projetos</a></div>
      </div>

      <div id="notesArea" style="display:none">
        <div class="card" style="margin-bottom: 60px;">
          <h3 style="font-size: 16px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 24px;">Nova nota</h3>
          <div style="display:grid; gap:24px; grid-template-columns:1fr 180px; margin-bottom:24px;">
            <div>
              <label class="field-label">Título *</label>
              <input type="text" id="noteTitle" placeholder="Ex.: Pilar P12">
            </div>
            <div>
              <label class="field-label">Tag / Categoria</label>
              <input type="text" id="noteTag" placeholder="Ex.: Estrutura">
            </div>
          </div>
          <div style="margin-bottom:24px;">
            <label class="field-label">Descrição</label>
            <textarea id="noteBody" placeholder="Descreva as observações do local" rows="3" style="width:100%; border:none; border-bottom:1.5px solid var(--border); background:transparent; color:var(--text-primary); font-family:var(--font-sans); font-size:14px; resize:vertical; padding:8px 0;"></textarea>
          </div>
          <button class="btn primary" id="addNoteBtn" style="min-height:42px;">Adicionar nota</button>
        </div>
        <div id="notesList" style="display:flex; flex-direction:column; gap:24px;"></div>
      </div>

    </div>
  </main>
</div>
<div id="sync-card-root"></div>
<script src="assets/db.js"></script>
<script src="assets/shell.js"></script>
<script>
SalsiShell.init('notes');
(async function () {
  'use strict';

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  const activeId = SalsiShell.getActiveProjectId();
  const activeProj = activeId ? await SalsiDB.getProject(activeId) : null;
  const pillEl = document.getElementById('activeProjectPill');
  if (pillEl) pillEl.querySelector('span').textContent = activeProj ? activeProj.name : 'Nenhum Projeto';

  if (!activeId) {
    document.getElementById('noProjectState').style.display = '';
    return;
  }
  document.getElementById('notesArea').style.display = '';

  async function renderList() {
    const list = await SalsiDB.getNotes(activeId);
    const container = document.getElementById('notesList');
    if (list.length === 0) {
      container.innerHTML = `<div class="empty"><strong>Nenhuma nota registrada</strong><span>Suas notas aparecerão aqui.</span></div>`;
      return;
    }
    container.innerHTML = list.map(n => `
      <div class="card" style="border-bottom: 1px solid var(--border); padding-bottom: 24px; margin-bottom: 24px;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:16px;">
          <div>
            <h4 style="font-family:var(--font-serif); font-size:18px; font-weight:500; margin:0 0 6px;">${esc(n.title)}</h4>
            <span class="badge-pill synced" style="font-size:10px;">${esc(n.tag || 'Geral')}</span>
          </div>
          <button class="btn danger" data-del="${n.id}" style="padding:6px 12px; font-size:11px;">Remover</button>
        </div>
        <p style="margin:12px 0 0; color:var(--text-secondary); font-size:14px; line-height:1.6;">${esc(n.body)}</p>
      </div>`).join('');

    container.querySelectorAll('[data-del]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (confirm('Deseja remover esta nota?')) {
          await SalsiDB.deleteNote(Number(btn.dataset.del));
          renderList();
        }
      });
    });
  }

  document.getElementById('addNoteBtn').addEventListener('click', async () => {
    const titleEl = document.getElementById('noteTitle');
    const bodyEl  = document.getElementById('noteBody');
    const tagEl   = document.getElementById('noteTag');

    const title = titleEl.value.trim();
    const body  = bodyEl.value.trim();
    const tag   = tagEl.value.trim();

    if (!title) { alert('O título é obrigatório.'); return; }

    await SalsiDB.addNote({
      projectId: activeId,
      title,
      body,
      tag,
      synced: 0
    });

    titleEl.value = '';
    bodyEl.value = '';
    tagEl.value = '';
    renderList();
  });

  renderList();
})();
</script>
</body>
</html>
