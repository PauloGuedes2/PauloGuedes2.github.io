<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Notas | Salsi</title>
  
  <!-- PWA Manifest & Icons -->
  <link rel="icon" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FDFCE8">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  
  <!-- Google Fonts: EB Garamond & Outfit -->
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  
  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "surface-dim": "#e6d8cb",
            "on-secondary-fixed-variant": "#474743",
            "on-primary-container": "#ffd7bb",
            "on-tertiary-fixed-variant": "#603f2b",
            "on-tertiary-fixed": "#2e1505",
            "surface-container": "#faebde",
            "secondary-fixed-dim": "#c8c6c2",
            "surface": "#fff8f4",
            "tertiary": "#64432f",
            "secondary-fixed": "#e5e2dd",
            "on-background": "#211a13",
            "error": "#ba1a1a",
            "surface-container-high": "#f4e6d9",
            "tertiary-container": "#7f5a45",
            "primary-fixed-dim": "#ffb77f",
            "on-secondary": "#ffffff",
            "primary-fixed": "#ffdcc3",
            "tertiary-fixed": "#ffdbc8",
            "on-tertiary": "#ffffff",
            "on-secondary-fixed": "#1c1c19",
            "outline": "#847469",
            "on-surface-variant": "#52443a",
            "on-error": "#ffffff",
            "error-container": "#ffdad6",
            "outline-variant": "#d7c3b6",
            "inverse-surface": "#372f26",
            "secondary-container": "#e5e2dd",
            "surface-bright": "#fff8f4",
            "on-primary-fixed": "#2f1500",
            "on-primary-fixed-variant": "#6c3a0a",
            "on-primary": "#ffffff",
            "surface-container-low": "#fff1e6",
            "inverse-primary": "#ffb77f",
            "surface-tint": "#885120",
            "on-secondary-container": "#656461",
            "inverse-on-surface": "#fdeee1",
            "on-tertiary-container": "#ffd7c1",
            "secondary": "#5f5e5b",
            "surface-container-lowest": "#ffffff",
            "on-surface": "#211a13",
            "primary": "#391E10", /* Bistre */
            "on-error-container": "#93000a",
            "background": "#FDFCE8", /* Ivory */
            "surface-container-highest": "#efe0d3",
            "primary-container": "#734128", /* Kobicha */
            "tertiary-fixed-dim": "#ecbda2",
            "surface-variant": "#efe0d3"
          },
          "fontFamily": {
            "headline-xl": ["EB Garamond"],
            "headline-lg": ["EB Garamond"],
            "headline-md": ["EB Garamond"],
            "body-md": ["Outfit"],
            "body-lg": ["Outfit"],
            "label-md": ["Outfit"],
            "label-sm": ["Outfit"]
          }
        }
      }
    }
  </script>
  
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .glass-nav {
      backdrop-filter: blur(12px);
      background-color: rgba(255, 248, 244, 0.8);
    }
    .linen-texture {
      background-image: radial-gradient(#e5e2dd 0.5px, transparent 0.5px);
      background-size: 24px 24px;
    }
    .notes-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .notes-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .notes-scroll::-webkit-scrollbar-thumb {
      background-color: #E2CEB1;
      border-radius: 10px;
    }
    .fade-slide-up {
      opacity: 0;
      transform: translateY(15px);
      transition: opacity 600ms cubic-bezier(0.16, 1, 0.3, 1), transform 600ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .fade-slide-up.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body class="bg-background text-on-background font-body-md overflow-x-hidden">

  <!-- Dynamic SideNav Root -->
  <div id="offline-banner-root"></div>
  <div id="sidebar-root"></div>

  <!-- Mobile TopAppBar -->
  <header class="md:hidden sticky top-0 z-40 w-full h-20 bg-surface/80 backdrop-blur-md flex justify-between items-center px-6 border-b border-outline-variant/20">
    <div class="flex items-center gap-3">
      <img alt="Salsi Logo" class="h-8 w-8 rounded-full" src="logo.png"/>
      <span class="font-headline-md text-headline-md text-primary">Salsi</span>
    </div>
    <div class="flex items-center gap-4">
      <a href="settings.html" class="w-8 h-8 rounded-full overflow-hidden bg-surface-container flex items-center justify-center">
        <span class="material-symbols-outlined text-primary">settings</span>
      </a>
    </div>
  </header>

  <!-- Main Content Canvas -->
  <main class="md:ml-64 transition-all duration-300">
    
    <div class="content px-6 md:px-16 py-12 max-w-7xl mx-auto">
      
      <!-- Editorial Page Header -->
      <div class="page-header-block mb-10 border-b border-outline-variant/25 pb-6">
        <h1 class="page-title font-headline-xl text-headline-xl text-primary">Notas de Campo</h1>
        <p class="page-sub font-body-md text-on-surface-variant italic mt-1">Observações e anotações técnicas do projeto ativo</p>
      </div>

      <!-- No project selected state -->
      <div id="noProjectState" class="p-12 border border-dashed border-outline-variant rounded-2xl flex flex-col items-center justify-center text-center space-y-4 bg-white" style="display:none">
        <span class="material-symbols-outlined text-[48px] text-outline opacity-40">pets</span>
        <h4 class="font-headline-md text-headline-md text-primary">Nenhum projeto selecionado</h4>
        <p class="font-body-md text-on-surface-variant max-w-xs">Escolha ou crie um projeto para começar a registrar notas de campo.</p>
        <button onclick="location.href='projects.html'" class="px-6 py-2 bg-primary text-white rounded-full font-label-md text-label-md">
          Ir para Projetos
        </button>
      </div>

      <!-- Main Notes Layout Grid -->
      <div id="notesArea" class="grid grid-cols-1 lg:grid-cols-3 gap-8" style="display:none">
        
        <!-- Left: Notes List Timeline (2/3 width) -->
        <div class="lg:col-span-2 space-y-6" id="notesList">
          <!-- Dynamically populated, fallback empty list is handled in JS -->
        </div>

        <!-- Right: Note Composer Card (1/3 width) -->
        <div class="space-y-6">
          <div class="bg-white p-6 rounded-2xl border border-outline-variant/30 shadow-sm space-y-4 sticky top-24">
            <h3 class="font-headline-md text-[18px] font-semibold text-primary border-b border-outline-variant/20 pb-2">Nova Nota</h3>
            
            <div class="space-y-4">
              <div>
                <label class="block text-[11px] font-semibold uppercase tracking-wider text-outline mb-1.5">Título da Nota *</label>
                <input type="text" id="noteTitle" placeholder="Ex.: Pilar P12" class="w-full rounded-xl border border-outline-variant/40 bg-surface/30 text-on-background focus:ring-1 focus:ring-primary focus:border-primary p-3 text-[14px]">
              </div>

              <div>
                <label class="block text-[11px] font-semibold uppercase tracking-wider text-outline mb-1.5">Tag / Categoria</label>
                <input type="text" id="noteTag" placeholder="Ex.: Estrutural" class="w-full rounded-xl border border-outline-variant/40 bg-surface/30 text-on-background focus:ring-1 focus:ring-primary focus:border-primary p-3 text-[14px]">
              </div>

              <div>
                <label class="block text-[11px] font-semibold uppercase tracking-wider text-outline mb-1.5">Conteúdo / Descrição</label>
                <textarea id="noteBody" placeholder="Descreva as observações detalhadas..." rows="4" class="w-full rounded-xl border border-outline-variant/40 bg-surface/30 text-on-background focus:ring-1 focus:ring-primary focus:border-primary p-3 text-[14px] resize-none"></textarea>
              </div>
            </div>

            <button id="addNoteBtn" class="w-full py-3.5 bg-primary text-white rounded-full font-label-md text-label-md hover:bg-primary-container transition-all duration-300 shadow-sm flex items-center justify-center gap-2 font-semibold">
              <span class="material-symbols-outlined text-[20px]">check</span>
              Salvar Nota
            </button>
          </div>
        </div>

      </div>

    </div>

    <!-- Footer / Credits -->
    <footer class="px-6 md:px-16 py-12 bg-surface text-center border-t border-outline-variant/15 mt-16">
      <div class="max-w-7xl mx-auto flex flex-col items-center">
        <img alt="Salsi Logo" class="h-10 w-10 mb-4 opacity-80 rounded-full" src="logo.png"/>
        <p class="font-headline-md text-headline-md text-primary mb-2">Estúdio Salsi</p>
        <p class="font-label-sm text-label-sm text-on-surface-variant max-w-lg mx-auto">
          Notas de campo estruturais e vistorias offline integradas continuamente.
        </p>
        <p class="font-label-sm text-label-sm text-outline mt-8">© 2026 Salsi.</p>
      </div>
    </footer>
  </main>

  <div id="sync-card-root"></div>

  <!-- Scripts -->
  <script src="assets/db.js"></script>
  <script src="assets/shell.js"></script>
  <script>
    SalsiShell.init('notes');
    (async function () {
      'use strict';

      function esc(s) { 
        return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); 
      }

      const activeId = localStorage.getItem('salsi_active_project_id');
      
      if (!activeId) {
        document.getElementById('noProjectState').style.display = 'block';
        return;
      }
      document.getElementById('notesArea').style.display = 'grid';

      async function renderList() {
        const list = await SalsiDB.getNotes(activeId);
        const container = document.getElementById('notesList');
        
        if (list.length === 0) {
          container.innerHTML = `
            <div class="p-12 border border-dashed border-outline-variant/60 rounded-2xl flex flex-col items-center justify-center text-center space-y-4 bg-white">
              <span class="material-symbols-outlined text-[48px] text-outline opacity-40">edit_note</span>
              <h4 class="font-headline-md text-headline-md text-primary">Nenhuma nota registrada</h4>
              <p class="font-body-md text-on-surface-variant max-w-xs">Use o compositor ao lado para adicionar observações ou revisões de campo.</p>
            </div>`;
          return;
        }

        // Timeline sorting: newest first
        container.innerHTML = list.reverse().map((n, index) => {
          return `
            <div class="p-6 rounded-2xl bg-white border border-outline-variant/20 shadow-sm relative group hover:shadow-md transition-all duration-300">
              <div class="flex justify-between items-start mb-4">
                <div class="flex items-center gap-3">
                  <div class="w-8 h-8 rounded-full bg-surface-container text-primary flex items-center justify-center text-xs font-bold font-body">
                    AR
                  </div>
                  <div>
                    <span class="font-semibold text-sm block leading-tight text-primary">${esc(n.title)}</span>
                    <span class="text-[10px] bg-primary-fixed/20 text-primary px-2.5 py-0.5 rounded-full font-bold uppercase tracking-wider mt-1 inline-block">
                      ${esc(n.tag || 'Geral')}
                    </span>
                  </div>
                </div>
                <div class="flex items-center gap-2">
                  <span class="text-[11px] text-outline italic">Visita de Campo</span>
                  <button data-del="${n.id}" class="w-8 h-8 rounded-full hover:bg-error/10 hover:text-error text-outline transition-colors flex items-center justify-center" title="Remover Nota">
                    <span class="material-symbols-outlined text-[18px]">delete</span>
                  </button>
                </div>
              </div>
              <p class="text-[15px] leading-relaxed text-on-surface-variant font-body whitespace-pre-line">
                ${esc(n.body)}
              </p>
            </div>`;
        }).join('');

        container.querySelectorAll('[data-del]').forEach(btn => {
          btn.addEventListener('click', async () => {
            if (confirm('Deseja remover esta nota de campo?')) {
              await SalsiDB.deleteNote(btn.dataset.del);
              renderList();
            }
          });
        });
      }

      document.getElementById('addNoteBtn').addEventListener('click', async () => {
        const titleEl = document.getElementById('noteTitle');
        const bodyEl  = document.getElementById('noteBody');
        const tagEl   = document.getElementById('noteTag');

        const title = titleEl.value.trim();
        const body  = bodyEl.value.trim();
        const tag   = tagEl.value.trim();

        if (!title) { 
          alert('O título da nota é obrigatório.'); 
          return; 
        }

        await SalsiDB.addNote({
          projectId: activeId,
          title,
          body,
          tag,
          synced: 0
        });

        titleEl.value = '';
        bodyEl.value = '';
        tagEl.value = '';
        renderList();
      });

      renderList();
    })();
  </script>
</body>
</html>
