<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salsi — Fotos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fbfaf8">
<link rel="stylesheet" href="assets/app.css">
<style>
  /* Lightbox Styles — Quiet Luxury Edition */
  .lightbox-overlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(251, 250, 248, 0.98);
    z-index: 10000;
    display: none;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .lightbox-overlay.active {
    display: flex;
    opacity: 1;
  }
  .lightbox-content {
    max-width: 95vw;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    animation: zoomIn 0.2s ease-out;
  }
  @keyframes zoomIn {
    from { transform: scale(0.95); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .lightbox-image {
    max-width: 100%;
    max-height: 75vh;
    object-fit: contain;
    border: 1px solid var(--border);
    box-shadow: 0 12px 40px rgba(142, 130, 115, 0.08);
  }
  .lightbox-caption {
    color: var(--text-primary);
    font-family: var(--font-serif);
    font-size: 16px;
    font-style: italic;
    text-align: center;
  }
  .lightbox-close {
    position: absolute;
    top: 30px; right: 30px;
    background: transparent;
    border: none;
    color: var(--text-primary);
    font-size: 32px;
    font-weight: 200;
    cursor: pointer;
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M4 11l8-7 8 7"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"/>
</symbol>
<symbol id="i-building" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <rect x="6" y="3" width="12" height="18" rx="1"/>
  <rect x="9" y="6.5" width="2" height="2" fill="currentColor" stroke="none"/><rect x="13" y="6.5" width="2" height="2" fill="currentColor" stroke="none"/>
  <rect x="9" y="11" width="2" height="2" fill="currentColor" stroke="none"/><rect x="13" y="11" width="2" height="2" fill="currentColor" stroke="none"/>
  <rect x="9" y="15.5" width="2" height="2" fill="currentColor" stroke="none"/><rect x="13" y="15.5" width="2" height="2" fill="currentColor" stroke="none"/>
</symbol>
<symbol id="i-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/>
</symbol>
<symbol id="i-notes" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <rect x="4" y="3" width="16" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/>
</symbol>
<symbol id="i-cube" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 2L20 6.5V17.5L12 22L4 17.5V6.5L12 2Z"/><path d="M12 12V22"/><path d="M12 12L20 6.5"/><path d="M12 12L4 6.5"/>
</symbol>
<symbol id="i-report" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M7 3h7l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v4h4"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="16" x2="15" y2="16"/>
</symbol>
<symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M3.5 12h3M17.5 12h3"/>
</symbol>
<symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M5 7h14"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M7 7l1 13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1l1-13"/>
</symbol>
<symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path d="M5 13l4 4L19 7"/>
</symbol>
</defs>
</svg>

<div id="offline-banner-root"></div>
<div class="shell">
  <div id="sidebar-root"></div>
  <main class="main">
    <div class="topbar">
      <div class="brand-mark"><img src="logo.png" alt="Salsi"><span class="display">Salsi</span></div>
      <a class="project-pill" href="projects.html" id="activeProjectPill">
        <svg><use href="#i-building"/></svg><span>Carregando…</span>
      </a>
    </div>
    <div class="content">
      
      <!-- Editorial Page Header -->
      <div class="page-header-block">
        <h1 class="page-title">Galeria do Local</h1>
        <p class="page-sub">Registros fotográficos integrados ao projeto ativo</p>
      </div>

      <div id="noProjectState" class="empty" style="display:none">
        <img src="logo.png" alt=""><strong>Nenhum projeto selecionado</strong>
        <span>Escolha um projeto antes de adicionar fotos.</span>
        <div style="margin-top:14px"><a class="btn primary" href="projects.html">Ir para Projetos</a></div>
      </div>

      <div id="photosArea" style="display:none">
        <div class="card" style="margin-bottom: 60px;">
          <h3 style="font-size: 16px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 24px;">Adicionar foto</h3>
          <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none">
          <div style="display:flex; gap:16px; flex-wrap:wrap; align-items:center;">
            <label class="btn primary" for="photoInput" style="min-height:42px; cursor:pointer;">Tirar / escolher foto</label>
            <input type="text" id="photoCaption" placeholder="Escreva uma legenda descritiva" style="flex:1; min-width:200px; padding:8px 0;">
          </div>
          <div id="photoPreviewWrap" style="display:none; margin-top:24px; border-top: 1px solid var(--border); padding-top:24px;">
            <img id="photoPreview" style="max-width:260px; border:1px solid var(--border); display:block; margin-bottom:16px;">
            <button class="btn primary" id="confirmPhotoBtn" style="min-height:42px;">Salvar foto</button>
          </div>
        </div>
        <div class="grid" id="photosGrid" style="gap: 32px;"></div>
      </div>

    </div>
  </main>
</div>
<div id="sync-card-root"></div>

<!-- Lightbox Modal -->
<div class="lightbox-overlay" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" title="Fechar">&times;</button>
  <div class="lightbox-content" id="lightboxContent">
    <img src="" class="lightbox-image" id="lightboxImg" alt="Foto ampliada">
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>
</div>

<script src="assets/db.js"></script>
<script src="assets/shell.js"></script>
<script>
SalsiShell.init('photos');
(async function () {
  'use strict';

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  const activeId = SalsiShell.getActiveProjectId();
  const activeProj = activeId ? await SalsiDB.getProject(activeId) : null;
  const pillEl = document.getElementById('activeProjectPill');
  if (pillEl) pillEl.querySelector('span').textContent = activeProj ? activeProj.name : 'Nenhum Projeto';

  if (!activeId) {
    document.getElementById('noProjectState').style.display = '';
    return;
  }
  document.getElementById('photosArea').style.display = '';

  const photoInput      = document.getElementById('photoInput');
  const photoCaption    = document.getElementById('photoCaption');
  const photoPreview    = document.getElementById('photoPreview');
  const photoPreviewWrap = document.getElementById('photoPreviewWrap');
  const confirmPhotoBtn = document.getElementById('confirmPhotoBtn');
  const photosGrid      = document.getElementById('photosGrid');

  let selectedBlob = null;

  photoInput.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    selectedBlob = file;
    photoPreview.src = URL.createObjectURL(file);
    photoPreviewWrap.style.display = 'block';
  });

  confirmPhotoBtn.addEventListener('click', async () => {
    if (!selectedBlob) return;
    const caption = photoCaption.value.trim();

    await SalsiDB.addPhoto({
      projectId: activeId,
      blob: selectedBlob,
      caption,
      synced: 0
    });

    // Reset
    photoInput.value = '';
    photoCaption.value = '';
    photoPreview.src = '';
    photoPreviewWrap.style.display = 'none';
    selectedBlob = null;

    renderGrid();
  });

  async function renderGrid() {
    const list = await SalsiDB.getPhotos(activeId);
    if (list.length === 0) {
      photosGrid.innerHTML = `<div class="empty" style="grid-column:1/-1"><strong>Nenhuma imagem registrada</strong><span>Suas fotos de campo aparecerão aqui.</span></div>`;
      return;
    }

    photosGrid.innerHTML = list.map(p => {
      const url = URL.createObjectURL(p.blob);
      return `
        <div class="card" style="margin:0; border-bottom:1px solid var(--border); padding-bottom:16px;">
          <div style="aspect-ratio:4/3; overflow:hidden; border:1px solid var(--border); margin-bottom:12px; cursor:pointer;" data-zoom="${url}" data-caption="${esc(p.caption || 'Sem legenda')}">
            <img src="${url}" alt="" style="width:100%; height:100%; object-fit:cover; transition:transform 0.3s;" onmouseover="this.style.transform='scale(1.03)'" onmouseout="this.style.transform='scale(1)'">
          </div>
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px;">
            <p style="font-size:13px; color:var(--text-secondary); margin:0; line-height:1.4;">${esc(p.caption || 'Sem legenda')}</p>
            <button class="btn danger" data-del="${p.id}" style="padding:4px 8px; font-size:10px;">Remover</button>
          </div>
        </div>`;
    }).join('');

    // Wire zoom
    photosGrid.querySelectorAll('[data-zoom]').forEach(div => {
      div.addEventListener('click', () => {
        const url = div.dataset.zoom;
        const cap = div.dataset.caption;
        openLightbox(url, cap);
      });
    });

    // Wire delete
    photosGrid.querySelectorAll('[data-del]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (confirm('Deseja remover esta foto?')) {
          await SalsiDB.deletePhoto(Number(btn.dataset.del));
          renderGrid();
        }
      });
    });
  }

  // Lightbox
  const lightbox        = document.getElementById('lightbox');
  const lightboxImg     = document.getElementById('lightboxImg');
  const lightboxCaption = document.getElementById('lightboxCaption');

  function openLightbox(url, cap) {
    lightboxImg.src = url;
    lightboxCaption.textContent = cap;
    lightbox.style.display = 'flex';
    setTimeout(() => lightbox.classList.add('active'), 10);
  }

  function closeLightbox() {
    lightbox.classList.remove('active');
    setTimeout(() => { lightbox.style.display = 'none'; }, 250);
  }

  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });

  renderGrid();
})();
</script>
</body>
</html>
