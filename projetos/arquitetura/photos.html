<div id="offline-banner-root"></div>
<div class="shell">
  <div id="sidebar-root"></div>
  <main class="main">
    <div class="topbar">
      <div class="brand-mark"><img src="logo.png" alt="Salsi"><span class="display">Salsi</span></div>
      <a class="project-pill" href="projects.html"><svg><use href="#i-building"/></svg><span>Trocar projeto</span></a>
    </div>
    <div class="content">
      <h1 class="page-title">Fotos do local</h1>
      <p class="page-sub">Capturadas em campo, guardadas no aparelho — sincronizam quando a conexão voltar.</p>

      <div id="noProjectState" class="empty" style="display:none">
        <img src="logo.png" alt=""><strong>Nenhum projeto selecionado</strong>
        <span>Escolha um projeto antes de adicionar fotos.</span>
        <div style="margin-top:14px"><a class="btn primary" href="projects.html"><svg><use href="#i-building"/></svg>Ir pra Projects</a></div>
      </div>

      <div id="photosArea" style="display:none">
        <div class="card">
          <h3>Adicionar foto</h3>
          <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none">
          <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
            <label class="btn primary" for="photoInput"><svg><use href="#i-camera"/></svg>Tirar / escolher foto</label>
            <input type="text" id="photoCaption" placeholder="Legenda (opcional)" style="flex:1;min-width:160px">
          </div>
          <div id="photoPreviewWrap" style="display:none;margin-top:10px">
            <img id="photoPreview" style="max-width:160px;border-radius:10px;border:1px solid var(--line)">
            <button class="btn primary" id="confirmPhotoBtn" style="margin-top:8px"><svg><use href="#i-check"/></svg>Salvar foto</button>
          </div>
        </div>
        <div class="grid" id="photosGrid"></div>
      </div>

    </div>
  </main>
</div>
<div id="sync-card-root"></div>
<script src="assets/db.js"></script>
<script src="assets/shell.js"></script>
<script>
SalsiShell.init('photos');
(async function () {
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function fmtDate(ts) { return new Date(ts).toLocaleString('pt-BR'); }

  const activeId = SalsiShell.getActiveProjectId();
  if (!activeId) {
    document.getElementById('noProjectState').style.display = '';
    return;
  }
  document.getElementById('photosArea').style.display = '';

  let pendingBlob = null;

  document.getElementById('photoInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    pendingBlob = file;
    document.getElementById('photoPreview').src = URL.createObjectURL(file);
    document.getElementById('photoPreviewWrap').style.display = '';
  });

  async function renderGrid() {
    const photos = await SalsiDB.getPhotos(activeId);
    const grid = document.getElementById('photosGrid');
    if (photos.length === 0) {
      grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><img src="logo.png" alt=""><strong>Nenhuma foto ainda</strong><span>Adicione a primeira foto deste projeto ali em cima.</span></div>`;
      return;
    }
    grid.innerHTML = photos.map(p => `
      <div class="card">
        <img src="${URL.createObjectURL(p.blob)}" alt="" style="width:100%;height:140px;object-fit:cover;border-radius:10px;margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
          <span style="font-size:13px">${esc(p.caption || 'Sem legenda')}</span>
          <span class="badge-pill ${p.synced ? 'synced' : 'pending'}">${p.synced ? 'Sincronizada' : 'Pendente'}</span>
        </div>
        <div style="color:var(--ink-dim);font-size:11.5px;margin:4px 0 10px">${fmtDate(p.createdAt)}</div>
        <button class="btn danger" data-del="${p.id}"><svg><use href="#i-trash"/></svg>Remover</button>
      </div>`).join('');
    grid.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', async () => {
      await SalsiDB.deletePhoto(btn.dataset.del);
      await renderGrid();
      await SalsiShell.refreshAll();
    }));
  }

  document.getElementById('confirmPhotoBtn').addEventListener('click', async () => {
    if (!pendingBlob) return;
    await SalsiDB.addPhoto({ projectId: activeId, blob: pendingBlob, caption: document.getElementById('photoCaption').value.trim() });
    pendingBlob = null;
    document.getElementById('photoCaption').value = '';
    document.getElementById('photoPreviewWrap').style.display = 'none';
    document.getElementById('photoInput').value = '';
    await renderGrid();
    await SalsiShell.refreshAll();
  });

  await renderGrid();
})();

</script>
</body>
</html>
