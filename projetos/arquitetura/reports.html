<div id="offline-banner-root"></div>
<div class="shell">
  <div id="sidebar-root"></div>
  <main class="main">
    <div class="topbar">
      <div class="brand-mark"><img src="logo.png" alt="Salsi"><span class="display">Salsi</span></div>
      <a class="project-pill" href="projects.html"><svg><use href="#i-building"/></svg><span>Trocar projeto</span></a>
    </div>
    <div class="content">
      <h1 class="page-title">Relatório do projeto</h1>
      <p class="page-sub">Um resumo pra imprimir ou exportar como PDF (pelo navegador).</p>

      <div id="noProjectState" class="empty" style="display:none">
        <img src="logo.png" alt=""><strong>Nenhum projeto selecionado</strong>
        <span>Escolha um projeto pra gerar o relatório.</span>
        <div style="margin-top:14px"><a class="btn primary" href="projects.html"><svg><use href="#i-building"/></svg>Ir pra Projects</a></div>
      </div>

      <div id="reportArea" style="display:none">
        <div style="margin-bottom:14px"><button class="btn primary" id="printBtn"><svg><use href="#i-report"/></svg>Imprimir / exportar PDF</button></div>
        <div class="card" id="reportBody"></div>
      </div>

      <style>
        @media print {
          .sidebar, .topbar, .offline-banner, .sync-card, #printBtn { display: none !important; }
          .main { margin: 0 !important; }
          body { background: #fff !important; }
        }
      </style>

    </div>
  </main>
</div>
<div id="sync-card-root"></div>
<script src="assets/db.js"></script>
<script src="assets/shell.js"></script>
<script>
SalsiShell.init('reports');
(async function () {
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function fmtDate(ts) { return new Date(ts).toLocaleString('pt-BR'); }

  const activeId = SalsiShell.getActiveProjectId();
  if (!activeId) { document.getElementById('noProjectState').style.display = ''; return; }
  document.getElementById('reportArea').style.display = '';

  const project = await SalsiDB.getProject(activeId);
  const [photos, notes, markups] = await Promise.all([
    SalsiDB.getPhotos(activeId), SalsiDB.getNotes(activeId), SalsiDB.getMarkups(activeId),
  ]);

  document.getElementById('reportBody').innerHTML = `
    <h2 style="font-family:'Manrope',sans-serif;color:var(--navy);margin:0 0 4px">${esc(project ? project.name : 'Projeto')}</h2>
    <p style="color:var(--ink-dim);margin:0 0 18px">${esc(project ? project.description : '')} — criado em ${project ? fmtDate(project.createdAt) : '—'}</p>

    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr));margin-bottom:20px">
      <div class="stat"><div class="num">${photos.length}</div><div class="label">Fotos</div></div>
      <div class="stat"><div class="num">${notes.length}</div><div class="label">Notas</div></div>
      <div class="stat"><div class="num">${markups.length}</div><div class="label">Marcações</div></div>
    </div>

    <h3 style="color:var(--navy)">Notas estruturais</h3>
    ${notes.length === 0 ? '<p style="color:var(--ink-dim)">Nenhuma nota registrada.</p>' :
      notes.map(n => `<div style="padding:8px 0;border-bottom:1px solid var(--line)"><strong>${esc(n.title)}</strong>${n.tag ? ' — ' + esc(n.tag) : ''}<br><span style="color:var(--ink-dim);font-size:13px">${esc(n.body || '')}</span></div>`).join('')}

    <h3 style="color:var(--navy);margin-top:18px">Marcações do modelo</h3>
    ${markups.length === 0 ? '<p style="color:var(--ink-dim)">Nenhuma marcação registrada.</p>' :
      markups.map(m => `<div style="padding:6px 0;border-bottom:1px solid var(--line);font-size:13px">Ponto ${m.number} — ${esc(m.note || '')}</div>`).join('')}

    <h3 style="color:var(--navy);margin-top:18px">Fotos do local (${photos.length})</h3>
    ${photos.length === 0 ? '<p style="color:var(--ink-dim)">Nenhuma foto registrada.</p>' :
      `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(100px,1fr))">${photos.map(p => `<div><img src="${URL.createObjectURL(p.blob)}" style="width:100%;height:80px;object-fit:cover;border-radius:8px"><div style="font-size:11px;color:var(--ink-dim)">${esc(p.caption || '')}</div></div>`).join('')}</div>`}
  `;

  document.getElementById('printBtn').addEventListener('click', () => window.print());
})();

</script>
</body>
</html>
