<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salsi — Relatórios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fbfaf8">
<link rel="stylesheet" href="assets/app.css">
<!-- jsPDF library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<div id="offline-banner-root"></div>
<div class="shell">
  <div id="sidebar-root"></div>
  <main class="main">
    <div class="topbar">
      <div class="brand-mark"><img src="logo.png" alt="Salsi"><span class="display">Salsi</span></div>
      <a class="project-pill" href="projects.html" id="activeProjectPill">
        <svg><use href="#i-building"/></svg><span>Carregando…</span>
      </a>
    </div>
    <div class="content">
      
      <!-- Editorial Page Header -->
      <div class="page-header-block">
        <h1 class="page-title">Relatórios Técnicos</h1>
        <p class="page-sub">Documentações consolidadas em formato PDF para exportação</p>
      </div>

      <div id="noProjectState" class="empty" style="display:none">
        <img src="logo.png" alt=""><strong>Nenhum projeto selecionado</strong>
        <span>Escolha um projeto para gerar o relatório.</span>
        <div style="margin-top:14px"><a class="btn primary" href="projects.html">Ir para Projetos</a></div>
      </div>

      <div id="reportArea" style="display:none">
        <div style="margin-bottom:32px; display:flex; gap:12px; flex-wrap:wrap;">
          <button class="btn primary" id="generatePdfBtn" style="min-height:42px;">
            <span>Gerar Relatório PDF</span>
          </button>
        </div>
        <div class="card" id="reportBody" style="border-top:1px solid var(--border); padding-top:32px; margin-top:16px;"></div>
      </div>

    </div>
  </main>
</div>
<div id="sync-card-root"></div>

<!-- ── SVG Icon Sprite ───────────────────────────────── -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M4 11l8-7 8 7"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"/>
</symbol>
<symbol id="i-building" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <rect x="6" y="3" width="12" height="18" rx="1"/>
  <rect x="9" y="6.5" width="2" height="2" fill="currentColor" stroke="none"/><rect x="13" y="6.5" width="2" height="2" fill="currentColor" stroke="none"/>
  <rect x="9" y="11" width="2" height="2" fill="currentColor" stroke="none"/><rect x="13" y="11" width="2" height="2" fill="currentColor" stroke="none"/>
  <rect x="9" y="15.5" width="2" height="2" fill="currentColor" stroke="none"/><rect x="13" y="15.5" width="2" height="2" fill="currentColor" stroke="none"/>
</symbol>
<symbol id="i-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/>
</symbol>
<symbol id="i-notes" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <rect x="4" y="3" width="16" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/>
</symbol>
<symbol id="i-cube" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 2L20 6.5V17.5L12 22L4 17.5V6.5L12 2Z"/><path d="M12 12V22"/><path d="M12 12L20 6.5"/><path d="M12 12L4 6.5"/>
</symbol>
<symbol id="i-report" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M7 3h7l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v4h4"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="16" x2="15" y2="16"/>
</symbol>
<symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M3.5 12h3M17.5 12h3"/>
</symbol>
</defs>
</svg>

<script src="assets/db.js"></script>
<script src="assets/shell.js"></script>
<script>
SalsiShell.init('reports');
(async function () {
  'use strict';

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function fmtDate(ts) { return new Date(ts).toLocaleDateString('pt-BR') + ' ' + new Date(ts).toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'}); }

  const activeId = SalsiShell.getActiveProjectId();
  const activeProj = activeId ? await SalsiDB.getProject(activeId) : null;
  const pillEl = document.getElementById('activeProjectPill');
  if (pillEl) pillEl.querySelector('span').textContent = activeProj ? activeProj.name : 'Nenhum Projeto';

  if (!activeId) {
    document.getElementById('noProjectState').style.display = '';
    return;
  }
  document.getElementById('reportArea').style.display = '';

  const project = await SalsiDB.getProject(activeId);
  const [photos, notes, markups] = await Promise.all([
    SalsiDB.getPhotos(activeId),
    SalsiDB.getNotes(activeId),
    SalsiDB.getMarkups(activeId),
  ]);

  // Render on-screen preview — Editorial minimal layout
  document.getElementById('reportBody').innerHTML = `
    <h2 style="font-family:var(--font-serif); font-size:26px; font-weight:400; margin:0 0 8px; color:var(--text-primary);">${esc(project ? project.name : 'Projeto')}</h2>
    <p style="color:var(--text-secondary); margin:0 0 24px; font-size:13.5px; font-family:var(--font-serif); font-style:italic;">
      ${project && project.client ? `Cliente: ${esc(project.client)}  |  ` : ''}
      ${project && project.address ? `Endereço: ${esc(project.address)}  |  ` : ''}
      Criado em ${project ? fmtDate(project.createdAt) : '—'}
    </p>
    ${project && project.description ? `<p style="font-size:14px; color:var(--text-primary); line-height:1.7; margin-bottom:32px; font-family:var(--font-serif); font-style:italic; border-left:2px solid var(--border); padding-left:16px;">${esc(project.description)}</p>` : ''}

    <div class="stat-row" style="margin-bottom:32px;">
      <div class="stat"><div class="num">${photos.length}</div><div class="label">Fotos</div></div>
      <div class="stat"><div class="num">${notes.length}</div><div class="label">Notas</div></div>
      <div class="stat"><div class="num">${markups.length}</div><div class="label">Medições</div></div>
    </div>

    <h3 style="color:var(--text-primary); font-family:var(--font-serif); font-weight:500; border-bottom:1px solid var(--border); padding-bottom:8px; margin-top:32px; font-size:18px;">Notas de Campo</h3>
    ${notes.length === 0 ? '<p style="color:var(--text-secondary); font-size:13.5px; margin-top:12px; font-family:var(--font-serif); font-style:italic;">Nenhuma nota registrada.</p>' :
      notes.map(n => `
        <div style="padding:16px 0; border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:6px;">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
            <strong style="color:var(--text-primary); font-size:14.5px;">${esc(n.title)}</strong>
            ${n.tag ? `<span class="badge-pill synced" style="font-size:10px;">${esc(n.tag)}</span>` : ''}
          </div>
          <span style="color:var(--text-secondary); font-size:13.5px; line-height:1.6;">${esc(n.body || '')}</span>
          <span style="color:var(--text-dim); font-size:11px; margin-top:4px;">${fmtDate(n.createdAt)}</span>
        </div>`).join('')}

    <h3 style="color:var(--text-primary); font-family:var(--font-serif); font-weight:500; border-bottom:1px solid var(--border); padding-bottom:8px; margin-top:48px; font-size:18px;">Galeria de Imagens</h3>
    ${photos.length === 0 ? '<p style="color:var(--text-secondary); font-size:13.5px; margin-top:12px; font-family:var(--font-serif); font-style:italic;">Nenhuma imagem registrada.</p>' :
      `<div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:24px; margin-top:16px;">
        ${photos.map(p => {
          let url = '';
          try { url = URL.createObjectURL(p.blob); } catch(_) {}
          return `
            <div style="display:flex; flex-direction:column; gap:8px; border-bottom:1px solid var(--border); padding-bottom:12px;">
              <img src="${url}" style="width:100%; height:120px; object-fit:cover; border:1px solid var(--border);">
              <div style="font-size:12px; color:var(--text-secondary); line-height:1.4; font-family:var(--font-serif); font-style:italic;">${esc(p.caption || 'Sem legenda')}</div>
            </div>`;
        }).join('')}
      </div>`}
  `;

  // ── jsPDF Report Generation ───────────────────────────
  const generatePdfBtn = document.getElementById('generatePdfBtn');
  generatePdfBtn.addEventListener('click', async () => {
    if (typeof window.jspdf === 'undefined') {
      alert('A biblioteca PDF não carregou. Verifique sua conexão à internet na primeira execução.');
      return;
    }

    generatePdfBtn.disabled = true;
    const originalText = generatePdfBtn.querySelector('span').textContent;
    generatePdfBtn.querySelector('span').textContent = 'Gerando PDF...';

    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      // Load Profile
      const prof = await SalsiDB.getProfile();

      // Title
      doc.setFont('helvetica', 'bold'); doc.setFontSize(22); doc.setTextColor(44, 39, 36);
      doc.text('Relatório Técnico de Visita', 20, 25);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(140, 130, 122);
      doc.text(`Gerado em: ${new Date().toLocaleString('pt-BR')} | Salsi`, 20, 32);

      // Profile details
      if (prof && (prof.name || prof.company || prof.registration)) {
        doc.setFontSize(10); doc.setFont('helvetica', 'bold'); doc.setTextColor(44, 39, 36);
        doc.text('Profissional Responsável:', 20, 42);
        doc.setFont('helvetica', 'normal'); doc.setTextColor(80, 80, 80);
        let profLine = `${prof.name || ''} ${prof.company ? ` | ${prof.company}` : ''} ${prof.registration ? ` | ${prof.registration}` : ''}`;
        doc.text(profLine, 20, 48);
      }

      doc.setDrawColor(200, 177, 149); doc.setLineWidth(0.5); doc.line(20, 52, 190, 52);

      // Project info
      doc.setFontSize(11); doc.setFont('helvetica', 'bold'); doc.setTextColor(44, 39, 36);
      doc.text(`PROJETO: ${project ? project.name : 'Projeto Sem Nome'}`, 20, 62);
      doc.setFont('helvetica', 'normal'); doc.setTextColor(80, 80, 80);
      doc.text(`Cliente: ${project ? (project.client || 'Não informado') : 'Não informado'}`, 20, 68);
      doc.text(`Endereço: ${project ? (project.address || 'Não informado') : 'Não informado'}`, 20, 74);
      doc.text(`Descrição: ${project ? (project.description || 'Nenhuma') : 'Nenhuma'}`, 20, 80);

      doc.line(20, 86, 190, 86);

      let yPos = 96;

      // Notes
      doc.setFont('helvetica', 'bold'); doc.setFontSize(14); doc.setTextColor(44, 39, 36);
      doc.text('Notas de Campo:', 20, yPos);
      yPos += 10;

      doc.setFontSize(10); doc.setFont('helvetica', 'normal'); doc.setTextColor(60, 60, 60);
      if (notes.length === 0) {
        doc.text('Nenhuma nota registrada.', 20, yPos);
        yPos += 10;
      } else {
        for (const n of notes) {
          if (yPos > 270) { doc.addPage(); yPos = 20; }
          doc.setFont('helvetica', 'bold'); doc.setTextColor(200, 177, 149);
          doc.text(`${n.title} [${n.tag || 'Geral'}]:`, 20, yPos);
          doc.setFont('helvetica', 'normal'); doc.setTextColor(60, 60, 60);
          doc.text(n.body || '', 20, yPos + 6);
          yPos += 18;
        }
      }

      // Photos
      if (photos.length > 0) {
        doc.addPage();
        yPos = 25;
        doc.setFont('helvetica', 'bold'); doc.setFontSize(14); doc.setTextColor(44, 39, 36);
        doc.text('Registro Fotográfico:', 20, yPos);
        yPos += 15;

        for (const p of photos) {
          if (yPos > 210) { doc.addPage(); yPos = 20; }
          try {
            const b64 = await new Promise(res => {
              const r = new FileReader();
              r.onloadend = () => res(r.result);
              r.readAsDataURL(p.blob);
            });
            doc.addImage(b64, 'JPEG', 20, yPos, 80, 60);
            doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(100, 100, 100);
            doc.text(p.caption || 'Sem legenda', 110, yPos + 30);
            yPos += 70;
          } catch (_) {}
        }
      }

      const pdfName = `Relatorio_${project ? project.name.replace(/\s+/g,'_') : 'Projeto'}.pdf`;
      doc.save(pdfName);
    } catch (err) {
      console.error(err);
      alert('Erro ao gerar o arquivo PDF.');
    } finally {
      generatePdfBtn.disabled = false;
      generatePdfBtn.querySelector('span').textContent = originalText;
    }
  });
})();
</script>
</body>
</html>
